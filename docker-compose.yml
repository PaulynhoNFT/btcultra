services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      BTC_DATA_DIR: /app/data
    volumes: ["btc_data:/app/data"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    environment:
      ENGINE_API_URL: http://backend:8000
    depends_on: [backend]
    restart: unless-stopped
volumes:
  btc_data:
