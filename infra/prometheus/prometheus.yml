global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'signal-platform'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'signal-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Node exporter (if added)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL exporter (if added)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis exporter (if added)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Custom engine metrics from DB (via backend)
  - job_name: 'engine-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics/engine'
